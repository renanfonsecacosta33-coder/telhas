<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="50%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#090d16" />
      </linearGradient>
      <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="50%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#1d4ed8" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c" />
        <stop offset="50%" stop-color="#ea580c" />
      </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="512" height="512" rx="113" fill="url(#bgGrad)" />
    
    <!-- Subtle Border -->
    <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" />
    
    <!-- Stylized Factory Roof / Telha Shape -->
    <g transform="translate(102.4, 92.16) scale(3.072)">
      <path d="M10 50 L35 22 L55 38 L75 22 L100 50 Z" fill="url(#accentGrad)" opacity="0.95" />
      <path d="M18 52 L43 25 L63 42 L83 25 L92 36" stroke="url(#primaryGrad)" stroke-width="5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Letters AJL -->
    <text x="256" y="373.76" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="128px" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="8px">AJL</text>

    <!-- Subtitle: FÁBRICAS -->
    <text x="256" y="440.32" 
          font-family="system-ui, -apple-system, sans-serif" 
